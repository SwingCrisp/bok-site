<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>소식 — 비오케이아트센터 (시안 A)</title>
<link rel="stylesheet" href="fonts.css?v=202609230053"><link rel="stylesheet" href="site.css?v=202609230053">
<style>
/* 소식: 제목 줄 → 고정 공지 2건(판) → 분류 필터 + 목록(표 형태) → 쪽 번호. 모바일: 표를 2줄 카드로. */
.pins{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.pins a.panel{display:grid;gap:8px;transition:border-color .2s}.pins a.panel:hover{border-color:var(--wood)}
.pins .k{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--wood)}
.pins h3{font-family:var(--serif);font-size:22px;font-weight:600;line-height:1.35}
.pins time{font-size:13px;color:var(--ink-2)}
@media(max-width:899px){.pins{grid-template-columns:1fr}}
.tbl{border-top:1px solid var(--line)}
.tbl a{display:grid;grid-template-columns:72px 1fr 110px 24px;gap:16px;align-items:center;padding:16px 8px;border-bottom:1px solid var(--line);transition:background .2s}
.tbl a:hover{background:var(--bg-2)}
.tbl .tag{font-size:12px;color:var(--wood)}.tbl h3{font-size:16px;font-weight:500;line-height:1.5}.tbl time{font-size:13px;color:var(--ink-2);text-align:right}.tbl i{color:var(--ink-2);font-style:normal}
@media(max-width:899px){.tbl a{grid-template-columns:1fr auto;gap:4px 12px}.tbl .tag{grid-column:1}.tbl time{grid-column:2;grid-row:1;text-align:right}.tbl h3{grid-column:1/-1;font-size:15px}.tbl i{display:none}}
.pager{display:flex;justify-content:center;gap:6px;margin-top:28px}
.pager a{min-width:40px;min-height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:99px;font-size:14px;color:var(--ink-2)}
.pager a[aria-current]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{display:flex;gap:8px}.search input{min-height:40px;background:var(--bg-2);border:1px solid var(--line);border-radius:99px;padding:0 16px;font-size:14px;width:220px}
</style>
</head>
<body data-nav="소식">
<main id="main"><div class="wrap">
  <nav class="crumb" aria-label="현재 위치"><a href="index.html">홈</a><span>/</span><span>소식</span></nav>
  <div class="page-head"><div><p class="eyebrow">소식</p><h1>소식</h1></div><p>공지, 대관 안내, 채용 소식을 모았습니다. 고정 공지는 항상 위에 보입니다.</p></div>

  <section class="sec" id="pinned">
    <div class="sec-head"><span class="no">01</span><div class="ti"><p class="eyebrow">고정 공지</p><h2>지금 꼭 보실 것</h2></div></div>
    <div class="pins" id="pins"></div>
  </section>

  <section class="sec" id="all">
    <div class="sec-head"><span class="no">02</span><div class="ti"><p class="eyebrow">전체</p><h2>전체 공지</h2></div>
      <div class="act" role="group" aria-label="분류"><button class="tab" aria-pressed="true" data-t="전체">전체</button><button class="tab" aria-pressed="false" data-t="안내">안내</button><button class="tab" aria-pressed="false" data-t="대관">대관</button><button class="tab" aria-pressed="false" data-t="채용">채용</button><form class="search" role="search" onsubmit="return false"><input type="search" placeholder="검색" aria-label="공지 검색"></form></div></div>
    <div class="tbl" id="tbl"></div>
    <nav class="pager" aria-label="쪽"><a href="#" aria-current="page">1</a><a href="#">2</a><a href="#">3</a><a href="#" aria-label="다음">›</a></nav>
  </section>
</div></main>
<script src="data.js?v=202609230053"></script><script src="site.js?v=202609230053"></script>
<script>
const N=window.BOK.notices,$=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),dt=d=>d?d.replaceAll("-","."):"—";
$("#pins").innerHTML=N.filter(n=>n.pin).map(n=>`<a class="panel" href="notice.html"><span class="k"><span class="pill">${n.tag}</span>고정</span><h3>${esc(n.title)}</h3><time>${dt(n.date)}</time></a>`).join("");
function list(t){$("#tbl").innerHTML=N.filter(n=>t==="전체"||n.tag===t).map(n=>`<a href="notice.html"><span class="tag">${n.tag}</span><h3>${esc(n.title)}</h3><time>${dt(n.date)}</time><i>→</i></a>`).join("")}
list("전체");
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-pressed",x===b));list(b.dataset.t)});
</script>
</body></html>
