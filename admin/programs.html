<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="admin.css">
<title>프로그램 — 관리자</title>
</head>
<body><div class="app" id="app"></div>
<script src="../data.js"></script><script src="admin.js"></script>
<script>
const A=window.ADMIN,db=A.db,esc=A.esc,st=p=>A.status(p);
let f={type:"전체",s:"전체",q:""};
function render(){
  const rows=db.programs.filter(p=>(f.type==="전체"||p.type===f.type)&&(f.s==="전체"||st(p)===f.s||(f.s==="진행·예정"&&!["종료","임시저장"].includes(st(p))))&&(!f.q||p.title.includes(f.q))).sort((a,b)=>(a.start||"")<(b.start||"")?1:-1);
  document.getElementById("app").innerHTML=A.nav("프로그램")+`<main class="main">
    <div class="top"><div><div class="crumb">프로그램</div><h1>공연·전시 ${db.programs.length}건</h1></div><div class="acts"><a class="btn" href="#" id="export">CSV 내보내기</a><a class="btn accent" href="program-edit.html?new=1">+ 새 프로그램</a></div></div>
    <div class="bar">
      ${["전체","공연","전시"].map(t=>`<button class="chip" data-type="${t}" aria-pressed="${f.type===t}">${t}</button>`).join("")}
      <span style="width:1px;height:20px;background:var(--line)"></span>
      ${["전체","진행·예정","예매중","예정","종료","임시저장","예약"].map(t=>`<button class="chip" data-s="${t}" aria-pressed="${f.s===t}">${t}</button>`).join("")}
      <input type="search" id="q" placeholder="제목 검색" value="${esc(f.q)}" style="margin-left:auto">
    </div>
    <div class="card" style="padding:0"><div class="tw"><table>
      <tr><th></th><th>제목</th><th>유형</th><th>기간</th><th>예매</th><th>상태</th><th>수정</th><th></th></tr>
      ${rows.map(p=>`<tr><td><img class="th" src="${p.poster}" alt=""></td><td><a href="program-edit.html?id=${p.id}"><span class="t">${esc(p.title)}</span><br><span class="s">${p.venue} · ${p.org||"구분 없음"}${p.rating?" · "+esc(p.rating):""}</span></a></td><td>${p.type}</td><td>${p.start}${p.end?"<br>– "+p.end:""}</td><td class="s">${p.booking.length?p.booking.map(b=>esc(b.label)).join(", "):"—"}</td><td><span class="st" data-s="${st(p)}">${st(p)}</span></td><td class="s">${p.updated}</td>
        <td style="white-space:nowrap;text-align:right"><a class="btn sm" href="program-edit.html?id=${p.id}">편집</a> <button class="btn sm" data-dup="${p.id}">복제</button></td></tr>`).join("")||'<tr><td colspan="8" style="text-align:center;color:var(--ink-2);padding:30px">해당하는 프로그램이 없습니다.</td></tr>'}
    </table></div></div>
    <p class="note" style="margin-top:14px">복제하면 제목에 "(복사)"가 붙은 임시 저장본이 생깁니다. 상태는 날짜와 예매 정보로 자동 계산되며, 직원이 직접 고르는 것은 매진·취소·연기뿐입니다.</p>
  </main>`;
  document.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{f.type=b.dataset.type;render()});
  document.querySelectorAll("[data-s]").forEach(b=>{if(b.classList.contains("chip"))b.onclick=()=>{f.s=b.dataset.s;render()}});
  const q=document.getElementById("q");q.oninput=()=>{f.q=q.value;render();document.getElementById("q").focus();document.getElementById("q").setSelectionRange(f.q.length,f.q.length)};
  document.querySelectorAll("[data-dup]").forEach(b=>b.onclick=()=>{const p=db.programs.find(x=>x.id===b.dataset.dup);const c={...p,id:A.uid("p"),title:p.title+" (복사)",draft:true,updated:A.TODAY,booking:p.booking.map(x=>({...x}))};db.programs.unshift(c);A.save();location.href="program-edit.html?id="+c.id});
  document.getElementById("export").onclick=e=>{e.preventDefault();const h=["id","type","org","title","venue","start","end","time","rating","price","status"];const csv=[h.join(",")].concat(db.programs.map(p=>h.map(k=>'"'+String(k==="status"?st(p):p[k]??"").replace(/"/g,'""')+'"').join(","))).join("\n");const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,\ufeff"+encodeURIComponent(csv);a.download="programs.csv";a.click();A.toast("CSV로 내보냈습니다")};
}
render();
</script></body></html>
