<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../fonts.css"><link rel="stylesheet" href="admin.css">
<meta name="robots" content="noindex, nofollow">
<title>대관 문의 — 관리자</title>
</head>
<body><div class="app" id="app"></div>
<script src="../data.js"></script><script src="admin.js"></script>
<script>
const A=window.ADMIN,db=A.db,esc=A.esc;
function render(){
  document.getElementById("app").innerHTML=A.nav("대관 문의")+`<main class="main">
  <div class="top"><div><div class="crumb">대관 문의</div><h1>문의 ${db.inquiries.length}건</h1></div><div class="acts"><button class="btn" id="csv">CSV 내보내기</button></div></div>
  <p class="note" style="margin-bottom:14px">문의는 사이트 폼에서 들어오며 담당자 메일로도 함께 갑니다. 개인정보는 응대 목적으로만 쓰고, 보관 기간(예: 1년 [확인 필요])이 지나면 삭제합니다.</p>
  <div class="grid" style="gap:12px">${db.inquiries.map(q=>`<div class="card" id="${q.id}"><h2><span>${q.space} · ${esc(q.type)} · <span class="s" style="font-weight:400;color:var(--ink-2)">${q.at}</span></span><span class="st" data-s="${q.state==="새 문의"?"예매중":"종료"}">${q.state}</span></h2>
    <div class="kv"><dt>희망일</dt><dd>1지망 ${q.d1}${q.d2?" · 2지망 "+q.d2:""}</dd><dt>인원</dt><dd>${q.ppl||"—"}</dd><dt>단체·담당</dt><dd>${esc(q.org||"—")} · ${esc(q.name)}</dd><dt>연락처</dt><dd>${q.tel} · ${q.email}</dd><dt>내용</dt><dd>${esc(q.msg)}</dd></div>
    <div class="acts" style="margin-top:12px"><a class="btn sm" href="mailto:${q.email}">메일로 답장</a><button class="btn sm" data-state="${q.id}">${q.state==="새 문의"?"답변 완료로 표시":"새 문의로 되돌리기"}</button><button class="btn sm danger" data-del="${q.id}">삭제(보관 기간 만료)</button></div></div>`).join("")}</div></main>`;
  document.querySelectorAll("[data-state]").forEach(b=>b.onclick=()=>{const q=db.inquiries.find(x=>x.id===b.dataset.state);q.state=q.state==="새 문의"?"답변 완료":"새 문의";A.save();render()});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{if(confirm("삭제할까요?")){db.inquiries=db.inquiries.filter(x=>x.id!==b.dataset.del);A.save();render()}});
  document.getElementById("csv").onclick=()=>A.toast("CSV로 내보냈습니다 (시안)");
}
render();
</script></body></html>
