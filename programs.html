<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>프로그램 — 비오케이아트센터 (시안 A)</title>
<link rel="stylesheet" href="fonts.css?v=202609260810">
<link rel="stylesheet" href="site.css?v=202609260810">
<style>
/* PC: 제목 줄 → 필터 줄(유형 | 월 | 보기) → 목록(6열 포스터, 월별 묶음) 또는 달력(7열) → 지난 프로그램.
   모바일: 필터는 가로 스크롤 칩, 목록은 2열, 달력은 점만 찍고 날짜를 누르면 아래에 그날 목록. */
.bar2{position:sticky;top:var(--bar);z-index:20;background:#15110ff2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin-top:28px}
.bar2 .wrap{display:flex;align-items:center;gap:8px;min-height:64px;flex-wrap:wrap}
.seg{display:flex;gap:6px}
.seg button,.months button{background:none;border:1px solid var(--line);color:var(--ink-2);font-size:14px;padding:0 16px;min-height:40px;border-radius:99px;cursor:pointer;transition:.2s;white-space:nowrap}
.seg button[aria-pressed=true],.months button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button:hover,.months button:hover{border-color:var(--wood);color:var(--wood)}
.seg button[aria-pressed=true]:hover{color:var(--bg)}
.seg button small{color:inherit;opacity:.6;margin-left:4px;font-size:12px}
.sep{width:1px;height:24px;background:var(--line);margin:0 8px}
.months{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.view{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.view button{background:none;border:0;color:var(--ink-2);font-size:14px;padding:0 16px;min-height:40px;cursor:pointer}
.view button[aria-pressed=true]{background:var(--wood);color:#1a1206;font-weight:600}
@media(max-width:899px){#calwrap .sec-head{flex-direction:column;align-items:flex-start;gap:6px}.bar2 .wrap{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:6px;padding-right:0}.sep{display:none}.view{margin-left:8px;flex:none}}

/* 목록 보기 */
.month{padding-top:48px}
.month .sec-head{margin-bottom:0}
.month h2 small{font-family:var(--sans);font-size:14px;color:var(--ink-2);font-weight:400;margin-left:10px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:24px;margin-top:20px}
@media(max-width:1199px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:899px){.grid{grid-template-columns:repeat(2,1fr);gap:14px}}
.empty{padding:40px;border:1px dashed var(--line);border-radius:var(--r);color:var(--ink-2);text-align:center;margin-top:20px}

/* 달력 보기 */
.cal{margin-top:24px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg-2)}
.cal .wk,.cal .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .wk span{padding:10px 0;text-align:center;font-size:12px;color:var(--ink-2);border-bottom:1px solid var(--line)}
.cal .wk span:first-child{color:#f0a19f}
.cell{min-width:0;width:100%;min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:4px;background:none;border-top:0;border-left:0;color:inherit;text-align:left;font:inherit}
.cell:nth-child(7n){border-right:0}
.cell .n{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1}
.cell.out{opacity:.35}.cell.sun .n{color:#f0a19f}
.cell.today .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--wood);color:#1a1206;margin:-4px 0 0 -5px}
.ev{display:block;font-size:12px;line-height:1.3;padding:4px 6px;border-radius:var(--r);background:var(--bg-3);color:var(--ink-3);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-left:2px solid var(--wood)}
.ev[data-t="전시"]{border-left-color:var(--ink-2)}
.ev[data-s="예매중"]{border-left-color:var(--red)}
.ev.cont{border-left-color:transparent;opacity:.75}
.cell .dots{display:none;gap:3px;margin-top:auto}
.cell .dots i{width:6px;height:6px;border-radius:50%;background:var(--wood)}
.agenda{margin-top:16px}
@media(max-width:899px){
  .cell{min-height:56px;padding:6px;cursor:pointer}.cell .ev{display:none}.cell .dots{display:flex}
  .cell[aria-pressed=true]{background:var(--bg-3)}
}
.arow{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.arow img{width:64px;aspect-ratio:1/1.414;object-fit:cover;border-radius:var(--r)}
.arow h3{font-size:15px;font-weight:600;line-height:1.4}.arow .sub{font-size:12px;color:var(--ink-2)}

/* 지난 프로그램 */
.past{padding-top:88px}
.past .grid{grid-template-columns:repeat(8,1fr);gap:16px}
@media(max-width:1199px){.past .grid{grid-template-columns:repeat(5,1fr)}}
@media(max-width:899px){.past .grid{grid-template-columns:repeat(3,1fr);gap:10px}}
.past .card .poster img{filter:saturate(.7) brightness(.85)}
.past .card h3{font-size:13px;-webkit-line-clamp:2}.past .card p{font-size:12px}
</style>
</head>
<body data-nav="프로그램">
<main id="main">
  <div class="wrap"><div class="page-head" style="border:0;padding-bottom:0"><div><p class="eyebrow">프로그램</p><h1>프로그램</h1></div><p>공연과 전시를 한 곳에서. 유형과 달을 고르고, 목록이나 달력으로 봅니다.</p></div></div>

  <div class="bar2"><div class="wrap">
    <div class="seg" role="group" aria-label="유형" id="types"></div>
    <span class="sep"></span>
    <div class="months" role="group" aria-label="달" id="months"></div>
    <div class="view" role="group" aria-label="보기 방식">
      <button id="v-list" aria-pressed="true">목록</button><button id="v-cal" aria-pressed="false">달력</button>
    </div>
  </div></div>

  <div class="wrap">
    <div id="list"></div>
    <div id="calwrap" hidden>
      <div class="sec-head" style="margin:32px 0 0;border:0"><span class="no"></span><div class="ti"><h2 id="cal-title"></h2></div><div class="act"><span class="note" style="border:0;padding:0">기간 행사는 매일 표시 · 모바일은 날짜를 눌러 목록</span></div></div>
      <div class="cal"><div class="wk"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="days" id="days"></div></div>
      <div class="agenda" id="agenda"></div>
    </div>

    <section class="past" id="past">
      <div class="sec-head"><span class="no">지난</span><div class="ti"><p class="eyebrow">지난 무대</p><h2>지난 프로그램</h2></div><div class="act"><a class="more" href="#">2025년 이전 보기 →</a></div></div>
      <div class="grid" id="past-grid"></div>
    </section>
  </div>
</main>

<script src="data.js?v=202609260810"></script>
<script src="site.js?v=202609260810"></script>
<script>
const D=window.BOK,$=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const TODAY="2026-09-18"; // 시안 기준일
const wk="일월화수목금토", TYPES=["전체","공연","전시"];
const all=D.programs.map(p=>({...p,end:p.end||p.start}));
const months=[...new Set(all.map(p=>p.start.slice(0,7)))].sort();
const Q=new URLSearchParams(location.search); // ?view=cal&month=2026-10 로 상태 공유
let type="전체", month=months.includes(Q.get("month"))?Q.get("month"):months[0], view=Q.get("view")==="cal"?"cal":"list", day=null;

const card=p=>`<a class="card" href="program.html"><div class="poster"><img src="${p.img}" alt="${esc(p.title)} 포스터" loading="lazy"><span class="badge" data-s="${p.status}">${p.status}</span><span class="org" data-o="${p.org}">${p.org}</span></div>
  <div class="meta">${p.type} · ${p.place}</div><h3>${esc(p.title)}</h3><p>${p.dateText}</p></a>`;
const inMonth=(p,m)=>p.start.slice(0,7)<=m&&p.end.slice(0,7)>=m;
const filt=()=>all.filter(p=>type==="전체"||p.type===type);

function renderTypes(){$("#types").innerHTML=TYPES.map(t=>{const n=t==="전체"?all.length:all.filter(p=>p.type===t).length;return `<button aria-pressed="${t===type}" data-t="${t}" ${n?"":'disabled style="opacity:.4"'}>${t}<small>${n}</small></button>`}).join("")}
function renderMonths(){$("#months").innerHTML=months.map(m=>`<button aria-pressed="${m===month}" data-m="${m}">${+m.slice(5)}월</button>`).join("")}
function renderList(){const ms=months.filter(m=>m>=month);let h="";
  for(const m of ms){const items=filt().filter(p=>inMonth(p,m)&&p.start.slice(0,7)===m);if(!items.length)continue;
    h+=`<section class="month"><div class="sec-head"><span class="no">${String(ms.indexOf(m)+1).padStart(2,"0")}</span><div class="ti"><h2>${m.slice(0,4)}년 ${+m.slice(5)}월<small>${items.length}건</small></h2></div></div><div class="grid">${items.map(card).join("")}</div></section>`}
  $("#list").innerHTML=h||`<div class="empty">해당하는 프로그램이 없습니다.</div>`}
function renderCal(){const [Y,M]=month.split("-").map(Number),first=new Date(Y,M-1,1),last=new Date(Y,M,0).getDate(),lead=first.getDay();
  $("#cal-title").textContent=`${Y}년 ${M}월`;let h="";
  for(let i=0;i<lead;i++){const d=new Date(Y,M-1,i-lead+1).getDate();h+=`<div class="cell out"><span class="n">${d}</span></div>`}
  for(let d=1;d<=last;d++){const iso=`${Y}-${String(M).padStart(2,"0")}-${String(d).padStart(2,"0")}`,w=(lead+d-1)%7;
    const ev=filt().filter(p=>p.start<=iso&&p.end>=iso);
    h+=`<button class="cell${w===0?" sun":""}${iso===TODAY?" today":""}" data-d="${iso}" aria-pressed="${iso===day}" aria-label="${M}월 ${d}일, 행사 ${ev.length}건"><span class="n">${d}</span>
      ${ev.map(p=>`<span class="ev${p.start!==iso?" cont":""}" data-t="${p.type}" data-s="${p.status}">${esc(p.title)}</span>`).join("")}
      <span class="dots">${ev.map(()=>"<i></i>").join("")}</span></button>`}
  const tail=(7-(lead+last)%7)%7;for(let i=1;i<=tail;i++)h+=`<div class="cell out"><span class="n">${i}</span></div>`;
  $("#days").innerHTML=h;renderAgenda()}
function renderAgenda(){if(!day){$("#agenda").innerHTML="";return}const ev=filt().filter(p=>p.start<=day&&p.end>=day);const d=new Date(day+"T00:00");
  $("#agenda").innerHTML=`<h3 style="font-size:15px;margin-bottom:6px">${d.getMonth()+1}월 ${d.getDate()}일 ${wk[d.getDay()]}요일 · ${ev.length}건</h3>`+(ev.map(p=>`<a class="arow" href="program.html"><img src="${p.img}" alt=""><div><div class="sub">${p.type} · ${p.place} · ${p.dateText}</div><h3>${esc(p.title)}</h3></div><span class="badge" data-s="${p.status}">${p.status}</span></a>`).join("")||`<div class="empty">이 날은 행사가 없습니다.</div>`)}
function renderPast(){$("#past-grid").innerHTML=D.past.map(p=>card({...p,status:"종료"})).join("")}
function render(){renderTypes();renderMonths();$("#list").hidden=view!=="list";$("#calwrap").hidden=view!=="cal";$("#v-list").setAttribute("aria-pressed",view==="list");$("#v-cal").setAttribute("aria-pressed",view==="cal");view==="list"?renderList():renderCal()}
document.addEventListener("click",e=>{const t=e.target.closest("[data-t],[data-m],#v-list,#v-cal,.cell[data-d]");if(!t)return;
  if(t.dataset.t&&t.closest("#types")){type=t.dataset.t;day=null}else if(t.dataset.m){month=t.dataset.m;day=null}else if(t.id==="v-list")view="list";else if(t.id==="v-cal")view="cal";
  else if(t.dataset.d){day=day===t.dataset.d?null:t.dataset.d;renderCal();return}
  render()});
render();renderPast();
</script>
</body>
</html>
